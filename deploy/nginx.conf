# Nginx site config for the Abharanam storefront (see ./README.md).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/abharanam
#   sudo ln -sf /etc/nginx/sites-available/abharanam /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file in place to add the :443 server
# block, the certificate paths and the http->https redirect:
#   sudo certbot --nginx -d example.com -d www.example.com

server {
    listen 80;
    listen [::]:80;

    # REPLACE with your real domain(s).
    server_name example.com www.example.com;

    # Product image uploads are presigned PUTs straight from the browser to S3,
    # so nothing large ever transits nginx. The API caps JSON bodies at 1mb.
    client_max_body_size 2m;

    # Next.js. /api/* is NOT proxied separately here on purpose: next.config.ts
    # rewrites it to 127.0.0.1:5000 so the browser stays same-origin.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for the websocket-style upgrade Next uses in some responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The API sets `app.set("trust proxy", 1)`, so these decide whether it
        # considers the request secure — the auth cookie depends on it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;

        # Server components fetch with cache: "no-store"; give slow Atlas
        # queries room before nginx gives up.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Next's build output is immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;
}
